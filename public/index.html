<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GILGAMESH · חדר ההערות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0e;--panel:#15171b;--panel2:#1b1e23;--line:#282c33;--line2:#343941;--text:#eef0f3;--muted:#9299a3;--accent:#ffd24a;--ink:#1b1504;--danger:#ff6b6b;--ok:#4fd18b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(1200px 600px at 50% -10%,#2a2416 0%,var(--bg) 60%);color:var(--text);font-family:Heebo,system-ui,sans-serif}
.card{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 22px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent)}
h1{margin:4px 0 2px;font-size:26px;letter-spacing:.06em}
p.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:16px}
.tabs button{height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--line2);color:var(--text)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 6px}
input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:inherit;font-size:16px;padding:0 12px;direction:ltr;text-align:left}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.go{width:100%;height:46px;margin-top:18px;border:0;border-radius:11px;background:var(--accent);color:var(--ink);font:inherit;font-size:16px;font-weight:800;cursor:pointer}
.go:disabled{opacity:.6}
.msg{min-height:20px;margin-top:12px;font-size:13.5px;line-height:1.5}
.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">חדר ההערות</div>
  <h1>GILGAMESH</h1>
  <p class="sub">צפייה, הערות וציור על הטריילר, יחד ובזמן אמת.</p>
  <div class="tabs"><button id="tIn" class="on">התחברות</button><button id="tUp">משתמש חדש</button></div>
  <form id="f" autocomplete="on">
    <label for="email">מייל</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="pw">סיסמה</label>
    <input id="pw" type="password" autocomplete="current-password" minlength="6" required>
    <button class="go" id="go" type="submit">כניסה</button>
    <div class="msg" id="msg"></div>
  </form>
</main>
<script src="./config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const C = window.ROOM_CONFIG || {};
const sb = createClient(C.url, C.anon, { auth: { persistSession: true, autoRefreshToken: true } });
const $ = (id) => document.getElementById(id);
const next = new URLSearchParams(location.search).get('next') || './room.html';
let mode = 'in';
const say = (t, k = '') => { $('msg').textContent = t; $('msg').className = 'msg ' + k; };
const setMode = (m) => { mode = m; $('tIn').classList.toggle('on', m === 'in'); $('tUp').classList.toggle('on', m === 'up'); $('go').textContent = m === 'in' ? 'כניסה' : 'יצירת משתמש'; $('pw').autocomplete = m === 'in' ? 'current-password' : 'new-password'; say(''); };
$('tIn').onclick = () => setMode('in'); $('tUp').onclick = () => setMode('up');
const { data: { session } } = await sb.auth.getSession();
if (session) location.replace(next);
$('f').onsubmit = async (e) => {
  e.preventDefault();
  const email = $('email').value.trim().toLowerCase(), password = $('pw').value;
  $('go').disabled = true; say(mode === 'in' ? 'מתחבר…' : 'יוצר משתמש…');
  try {
    if (mode === 'up') {
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      if (!data.session) { const r = await sb.auth.signInWithPassword({ email, password }); if (r.error) throw new Error('המשתמש נוצר, אבל הכניסה נכשלה. ודאו שאישור המייל כבוי ב-Supabase.'); }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
    location.replace(next);
  } catch (err) {
    const m = String(err.message || err);
    say(/Invalid login/i.test(m) ? 'מייל או סיסמה לא נכונים.' : /already registered/i.test(m) ? 'המייל הזה כבר רשום. עברו להתחברות.' : /at least 6/i.test(m) ? 'סיסמה של 6 תווים לפחות.' : m, 'err');
  } finally { $('go').disabled = false; }
};
</script>
</body>
</html>
